<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎉 VartMap Lucky Draw</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#1a5e1a 0%,#2d8e2d 50%,#1a5e1a 100%); min-height:100vh; overflow-x:hidden; }
.container { max-width:420px; margin:0 auto; padding:16px; }
.header { text-align:center; padding:20px 0; color:#fff; }
.header h1 { font-size:22px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
.header p { font-size:13px; opacity:.85; margin-top:4px; }
.card { background:#fff; border-radius:16px; padding:24px; margin-bottom:16px; box-shadow:0 8px 32px rgba(0,0,0,.15); }
.card h2 { font-size:18px; color:#1a5e1a; margin-bottom:16px; text-align:center; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:#333; margin-bottom:6px; }
.form-group input, .form-group select { width:100%; padding:12px 14px; border:2px solid #e0e0e0; border-radius:10px; font-size:15px; transition:border .2s; }
.form-group input:focus, .form-group select:focus { outline:none; border-color:#2d8e2d; }
.btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,#2d8e2d,#1a5e1a); color:#fff; box-shadow:0 4px 15px rgba(45,142,45,.4); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(45,142,45,.5); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-spin { background:linear-gradient(135deg,#FF6B35,#e91e63); color:#fff; font-size:20px; padding:18px; box-shadow:0 4px 20px rgba(233,30,99,.4); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
.btn-spin:disabled { animation:none; }
.steps { display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.step { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:#e0e0e0; color:#999; transition:all .3s; }
.step.active { background:#2d8e2d; color:#fff; box-shadow:0 2px 8px rgba(45,142,45,.4); }
.step.done { background:#4CAF50; color:#fff; }
.wheel-wrapper { position:relative; margin:0 auto 20px; width:300px; height:300px; }
.wheel-pointer-top { position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:10; font-size:28px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
canvas { border-radius:50%; box-shadow:0 4px 20px rgba(0,0,0,.2); }
.prize-popup { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:1000; align-items:center; justify-content:center; }
.prize-popup.show { display:flex; }
.prize-card { background:#fff; border-radius:20px; padding:32px; text-align:center; max-width:340px; margin:16px; animation:bounceIn .5s; }
@keyframes bounceIn { 0%{transform:scale(.5);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
.prize-card .emoji { font-size:64px; margin-bottom:12px; }
.prize-card h3 { font-size:22px; color:#1a5e1a; margin-bottom:8px; }
.prize-card p { font-size:14px; color:#666; margin-bottom:16px; }
.confetti { position:fixed; top:-10px; z-index:999; pointer-events:none; }
.info-box { background:#f0f7f0; border-left:4px solid #2d8e2d; padding:12px; border-radius:0 8px 8px 0; margin-bottom:14px; font-size:13px; color:#333; }
.error { color:#e91e63; font-size:13px; margin-top:6px; }
.timer { text-align:center; font-size:13px; color:#999; margin-top:8px; }
.lang-toggle { position:absolute; top:16px; right:16px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
.hidden { display:none !important; }
.brand { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px; }
.brand img { height:28px; }
.prize-details { background:#f8f9fa; border-radius:10px; padding:16px; margin:12px 0; }
.prize-details div { display:flex; justify-content:space-between; padding:4px 0; font-size:14px; }
.prize-details .label { color:#666; }
.prize-details .value { font-weight:700; color:#1a5e1a; }
.spins-left { text-align:center; background:#FFF3E0; border-radius:10px; padding:10px; margin-bottom:16px; font-size:14px; color:#E65100; }
</style>
</head>
<body>

<button class="lang-toggle" onclick="toggleLang()">हिंदी</button>

<div class="container">
  <div class="header">
    <div class="brand">🌾 <strong>VartMap Krishi Sahayak</strong></div>
    <h1 id="headerTitle">🎉 Lucky Draw Spin & Win!</h1>
    <p id="headerSub">Spin the wheel and win exciting prizes</p>
  </div>

  <div class="steps">
    <div class="step active" id="s1">1</div>
    <div class="step" id="s2">2</div>
    <div class="step" id="s3">3</div>
  </div>

  <!-- STEP 1: Phone Verification -->
  <div class="card" id="step1">
    <h2 id="step1Title">📱 Enter Your Details</h2>
    <div class="info-box" id="step1Info">Enter your phone number and coupon code from product packaging to spin the wheel.</div>
    <div class="form-group">
      <label id="lblName">Your Name</label>
      <input type="text" id="farmerName" placeholder="e.g. Ramesh Kumar">
    </div>
    <div class="form-group">
      <label id="lblPhone">WhatsApp Number</label>
      <input type="tel" id="farmerPhone" placeholder="e.g. 9876543210" maxlength="10" inputmode="numeric">
    </div>
    <div class="form-group">
      <label id="lblCoupon">Coupon Code <small>(from product pack)</small></label>
      <input type="text" id="couponCode" placeholder="e.g. VART8A3F2C1D" style="text-transform:uppercase">
    </div>
    <div class="form-group">
      <label id="lblLang">Language / भाषा</label>
      <select id="farmerLang">
        <option value="hi">हिंदी</option>
        <option value="en">English</option>
        <option value="mr">मराठी</option>
        <option value="gu">ગુજરાતી</option>
        <option value="te">తెలుగు</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>
    </div>
    <div id="step1Error" class="error hidden"></div>
    <button class="btn btn-primary" id="btnVerify" onclick="verifyAndProceed()">Verify & Continue →</button>
  </div>

  <!-- STEP 2: Spin The Wheel -->
  <div class="card hidden" id="step2">
    <h2>🎰 Spin The Wheel!</h2>
    <div class="spins-left" id="spinsLeft">You have <strong>1</strong> spin remaining</div>
    <div class="wheel-wrapper">
      <div class="wheel-pointer-top">📍</div>
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <button class="btn btn-spin" id="btnSpin" onclick="spinWheel()">🎯 TAP TO SPIN!</button>
    <div class="timer hidden" id="spinTimer"></div>
  </div>

  <!-- STEP 3: Result -->
  <div class="card hidden" id="step3">
    <div style="text-align:center">
      <div id="resultEmoji" style="font-size:64px;margin-bottom:12px"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultDesc" style="color:#666;margin-bottom:16px"></p>
      <div class="prize-details" id="prizeDetails"></div>
      <p style="font-size:12px;color:#999;margin-top:12px" id="resultNote"></p>
    </div>
  </div>
</div>

<!-- Prize Popup with Confetti -->
<div class="prize-popup" id="prizePopup">
  <div class="prize-card">
    <div class="emoji" id="popupEmoji">🎉</div>
    <h3 id="popupTitle">Congratulations!</h3>
    <p id="popupDesc"></p>
    <button class="btn btn-primary" onclick="closePrizePopup()" style="margin-top:12px">View Details</button>
  </div>
</div>

<canvas id="confettiCanvas" class="confetti" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999"></canvas>

<script>
const API = 'https://vartmap-admin-api.onrender.com';
const WHEEL_ID = new URLSearchParams(window.location.search).get('id') || window.location.pathname.split('/spin/')[1] || '';

let wheelData = null;
let segments = [];
let farmerData = null;
let isSpinning = false;
let currentAngle = 0;
let lang = 'en';

const translations = {
  en: {
    title: '🎉 Lucky Draw Spin & Win!',
    sub: 'Spin the wheel and win exciting prizes',
    step1Title: '📱 Enter Your Details',
    step1Info: 'Enter your phone number and coupon code from product packaging to spin the wheel.',
    lblName: 'Your Name',
    lblPhone: 'WhatsApp Number',
    lblCoupon: 'Coupon Code (from product pack)',
    lblLang: 'Language',
    verify: 'Verify & Continue →',
    tapSpin: '🎯 TAP TO SPIN!',
    spinning: '⏳ Spinning...',
    congrats: '🎉 Congratulations!',
    betterLuck: '🍀 Better Luck Next Time!',
    betterLuckDesc: 'Don\'t worry! Keep purchasing to get more chances.',
    prizeNote: 'Prize will be credited to your account within 24 hours. You\'ll receive a WhatsApp confirmation.',
    noSpins: 'You have already used all your spins for this campaign.',
    invalidCoupon: 'Invalid or already used coupon code.',
    phoneRequired: 'Please enter your phone number.',
    nameRequired: 'Please enter your name.',
    expired: 'This campaign has ended.',
    notStarted: 'This campaign has not started yet.',
  },
  hi: {
    title: '🎉 लकी ड्रा स्पिन एंड विन!',
    sub: 'व्हील घुमाएं और शानदार इनाम जीतें',
    step1Title: '📱 अपनी जानकारी दर्ज करें',
    step1Info: 'व्हील घुमाने के लिए अपना फोन नंबर और प्रोडक्ट पैकेजिंग से कूपन कोड दर्ज करें।',
    lblName: 'आपका नाम',
    lblPhone: 'व्हाट्सएप नंबर',
    lblCoupon: 'कूपन कोड (प्रोडक्ट पैक से)',
    lblLang: 'भाषा',
    verify: 'सत्यापित करें और आगे बढ़ें →',
    tapSpin: '🎯 स्पिन करने के लिए टैप करें!',
    spinning: '⏳ घूम रहा है...',
    congrats: '🎉 बधाई हो!',
    betterLuck: '🍀 अगली बार किस्मत अच्छी होगी!',
    betterLuckDesc: 'चिंता न करें! और खरीदारी करें और मौके पाएं।',
    prizeNote: 'इनाम 24 घंटे के भीतर आपके खाते में जमा होगा। आपको व्हाट्सएप पर पुष्टि मिलेगी।',
    noSpins: 'आपने इस कैंपेन के लिए अपने सभी स्पिन का उपयोग कर लिया है।',
    invalidCoupon: 'अमान्य या पहले से उपयोग किया गया कूपन कोड।',
    phoneRequired: 'कृपया अपना फोन नंबर दर्ज करें।',
    nameRequired: 'कृपया अपना नाम दर्ज करें।',
    expired: 'यह कैंपेन समाप्त हो गया है।',
    notStarted: 'यह कैंपेन अभी शुरू नहीं हुआ है।',
  }
};

function t(key) { return (translations[lang] || translations.en)[key] || translations.en[key] || key; }

function toggleLang() {
  lang = lang === 'en' ? 'hi' : 'en';
  document.querySelector('.lang-toggle').textContent = lang === 'en' ? 'हिंदी' : 'English';
  document.getElementById('headerTitle').textContent = t('title');
  document.getElementById('headerSub').textContent = t('sub');
  document.getElementById('step1Title').textContent = t('step1Title');
  document.getElementById('step1Info').textContent = t('step1Info');
  document.getElementById('lblName').textContent = t('lblName');
  document.getElementById('lblPhone').textContent = t('lblPhone');
  document.getElementById('lblCoupon').innerHTML = t('lblCoupon');
  document.getElementById('btnVerify').textContent = t('verify');
  document.getElementById('btnSpin').textContent = t('tapSpin');
}

// Load wheel data
async function loadWheel() {
  try {
    const r = await fetch(API + '/api/v1/public/spin-wheel/' + WHEEL_ID);
    if (!r.ok) throw new Error('Wheel not found');
    wheelData = await r.json();
    segments = wheelData.segments || [];
    
    document.getElementById('headerTitle').textContent = wheelData.name || t('title');
    document.getElementById('headerSub').textContent = wheelData.description || t('sub');
    
    if (wheelData.status !== 'active') {
      showError(t('expired'));
      return;
    }
    
    drawWheel();
  } catch(e) {
    document.querySelector('.container').innerHTML = '<div class="card" style="text-align:center;margin-top:40px"><h2>❌ Wheel Not Found</h2><p style="color:#666;margin-top:8px">This spin wheel link is invalid or has expired.</p></div>';
  }
}

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 150, cy = 150, r = 140;
  
  ctx.clearRect(0, 0, 300, 300);
  
  if (!segments.length) return;
  
  const total = segments.length;
  const arc = (2 * Math.PI) / total;
  
  segments.forEach((seg, i) => {
    const startAngle = currentAngle + (i * arc);
    const endAngle = startAngle + arc;
    
    // Draw segment
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = seg.color || '#4CAF50';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Segoe UI';
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = 2;
    
    const label = seg.label.length > 14 ? seg.label.substring(0, 14) + '...' : seg.label;
    ctx.fillText(label, r - 12, 4);
    ctx.restore();
  });
  
  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#1a5e1a';
  ctx.font = 'bold 11px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SPIN', cx, cy);
}

async function verifyAndProceed() {
  const name = document.getElementById('farmerName').value.trim();
  const phone = document.getElementById('farmerPhone').value.trim().replace(/\D/g, '');
  const coupon = document.getElementById('couponCode').value.trim().toUpperCase();
  const langSel = document.getElementById('farmerLang').value;
  const errEl = document.getElementById('step1Error');
  
  errEl.classList.add('hidden');
  
  if (!name) { errEl.textContent = t('nameRequired'); errEl.classList.remove('hidden'); return; }
  if (!phone || phone.length < 10) { errEl.textContent = t('phoneRequired'); errEl.classList.remove('hidden'); return; }
  
  const btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.textContent = '⏳ Verifying...';
  
  try {
    const r = await fetch(API + '/api/v1/public/spin-wheel/' + WHEEL_ID + '/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, phone: '91' + phone.slice(-10), coupon_code: coupon, language: langSel })
    });
    
    const d = await r.json();
    
    if (!r.ok) {
      errEl.textContent = d.error || 'Verification failed';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = t('verify');
      return;
    }
    
    farmerData = d;
    
    if (d.spins_remaining <= 0) {
      errEl.textContent = t('noSpins');
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = t('verify');
      return;
    }
    
    // Move to step 2
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('s1').classList.remove('active');
    document.getElementById('s1').classList.add('done');
    document.getElementById('s2').classList.add('active');
    document.getElementById('spinsLeft').innerHTML = `You have <strong>${d.spins_remaining}</strong> spin${d.spins_remaining > 1 ? 's' : ''} remaining`;
    
    drawWheel();
  } catch(e) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = t('verify');
  }
}

async function spinWheel() {
  if (isSpinning || !farmerData) return;
  isSpinning = true;
  
  const btn = document.getElementById('btnSpin');
  btn.disabled = true;
  btn.textContent = t('spinning');
  
  try {
    // Call API to determine result (server-side randomization)
    const r = await fetch(API + '/api/v1/public/spin-wheel/' + WHEEL_ID + '/spin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ farmer_id: farmerData.farmer_id, phone: farmerData.phone })
    });
    
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    
    const winningIndex = segments.findIndex(s => s.id === d.segment_id);
    if (winningIndex === -1) throw new Error('Invalid result');
    
    // Animate the wheel to land on the winning segment
    const segArc = (2 * Math.PI) / segments.length;
    const targetAngle = -(winningIndex * segArc + segArc / 2) + Math.PI * 1.5; // top pointer
    const totalRotation = (Math.PI * 2 * 8) + targetAngle - currentAngle; // 8 full rotations + target
    
    const duration = 5000;
    const startTime = Date.now();
    const startAngle = currentAngle;
    
    function animate() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      // Ease out cubic for realistic deceleration
      const eased = 1 - Math.pow(1 - progress, 3);
      currentAngle = startAngle + totalRotation * eased;
      
      drawWheel();
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        // Animation complete - show result
        isSpinning = false;
        showResult(d);
      }
    }
    
    animate();
    
  } catch(e) {
    isSpinning = false;
    btn.disabled = false;
    btn.textContent = t('tapSpin');
    alert(e.message || 'Spin failed. Please try again.');
  }
}

function showResult(result) {
  const isBetterLuck = result.prize_type === 'better_luck';
  
  // Show popup
  document.getElementById('popupEmoji').textContent = isBetterLuck ? '🍀' : '🎉';
  document.getElementById('popupTitle').textContent = isBetterLuck ? t('betterLuck') : t('congrats');
  document.getElementById('popupDesc').textContent = result.label;
  document.getElementById('prizePopup').classList.add('show');
  
  if (!isBetterLuck) {
    launchConfetti();
  }
  
  // Prepare step 3
  document.getElementById('resultEmoji').textContent = isBetterLuck ? '🍀' : '🏆';
  document.getElementById('resultTitle').textContent = isBetterLuck ? t('betterLuck') : `You Won: ${result.label}!`;
  document.getElementById('resultDesc').textContent = isBetterLuck ? t('betterLuckDesc') : '';
  
  let detailsHTML = '';
  if (!isBetterLuck) {
    detailsHTML = `
      <div><span class="label">Prize</span><span class="value">${result.label}</span></div>
      <div><span class="label">Type</span><span class="value">${result.prize_type}</span></div>
      ${result.prize_value ? `<div><span class="label">Value</span><span class="value">₹${result.prize_value}</span></div>` : ''}
      <div><span class="label">Reference</span><span class="value">${result.reference_id || '-'}</span></div>
    `;
  }
  document.getElementById('prizeDetails').innerHTML = detailsHTML;
  document.getElementById('resultNote').textContent = isBetterLuck ? '' : t('prizeNote');
    // Add link to prize history
    if (!isBetterLuck) {
      document.getElementById('prizeDetails').innerHTML += `
        <div style="margin-top:12px;text-align:center">
          <a href="/my-prizes" style="color:#1a5e1a;font-weight:600;font-size:14px">📋 View All My Prizes →</a>
        </div>`;
    }

}

function closePrizePopup() {
  document.getElementById('prizePopup').classList.remove('show');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.remove('hidden');
  document.getElementById('s2').classList.remove('active');
  document.getElementById('s2').classList.add('done');
  document.getElementById('s3').classList.add('active');
  stopConfetti();
}

// Confetti
let confettiAnimId = null;
function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const pieces = [];
  const colors = ['#FF6B35','#e91e63','#2d8e2d','#FFD700','#2196F3','#9C27B0','#00BCD4','#FF9800'];
  
  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10
    });
  }
  
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotSpeed;
      if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    confettiAnimId = requestAnimationFrame(draw);
  }
  draw();
}

function stopConfetti() {
  if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
  document.getElementById('confettiCanvas').style.display = 'none';
}

function showError(msg) {
  document.querySelector('.container').innerHTML += `<div class="card" style="text-align:center"><p style="color:#e91e63">${msg}</p></div>`;
}

// Initialize
if (WHEEL_ID) { loadWheel(); }
else { showError('No wheel ID specified.'); }
</script>
</body>
</html>
