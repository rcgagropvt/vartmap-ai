<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VartMap Krishi Sahayak - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#333}
        .login-page{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a6b3c,#0d4a2a)}
        .login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:420px;text-align:center}
        .login-box img,.login-logo{font-size:48px;color:#1a6b3c;margin-bottom:8px}
        .login-box h1{color:#1a6b3c;font-size:22px;margin-bottom:4px}
        .login-box .sub{color:#888;margin-bottom:24px;font-size:14px}
        .login-box input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
        .login-box input:focus{border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.1)}
        .btn{padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
        .btn-primary{background:#1a6b3c;color:#fff;width:100%}
        .btn-primary:hover{background:#145530}
        .btn-sm{padding:8px 16px;font-size:12px}
        .btn-outline{background:transparent;border:1px solid #ddd;color:#555}
        .btn-outline:hover{background:#f5f5f5}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-success{background:#27ae60;color:#fff}
        .btn-warning{background:#f39c12;color:#fff}
        .error-msg{color:#e74c3c;font-size:13px;margin-bottom:12px;display:none}

        /* Layout */
        .app{display:none;height:100vh;overflow:hidden}
        .sidebar{width:240px;background:#0d1f17;color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto;transition:all .3s;z-index:100}
        .sidebar .logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:16px;font-weight:700;color:#4ade80}
        .sidebar .logo span{color:#fff;font-weight:400;font-size:12px;display:block;margin-top:2px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;transition:all .2s;border-left:3px solid transparent}
        .nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
        .nav-item.active{background:rgba(74,222,128,.1);color:#4ade80;border-left-color:#4ade80}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        .nav-section{padding:12px 20px 6px;font-size:10px;text-transform:uppercase;color:rgba(255,255,255,.3);letter-spacing:1px;margin-top:8px}

        .main{margin-left:240px;height:100vh;overflow-y:auto}
        .topbar{background:#fff;padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
        .topbar h2{font-size:18px;color:#333}
        .topbar-right{display:flex;align-items:center;gap:12px}
        .topbar-right .user-name{font-size:13px;color:#666}
        .content{padding:24px}

        /* Cards */
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
        .stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #1a6b3c}
        .stat-card .label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px}
        .stat-card .value{font-size:28px;font-weight:700;color:#1a6b3c;margin:6px 0}
        .stat-card .sub{font-size:11px;color:#aaa}
        .stat-card.orange{border-left-color:#f39c12}
        .stat-card.orange .value{color:#f39c12}
        .stat-card.blue{border-left-color:#3498db}
        .stat-card.blue .value{color:#3498db}
        .stat-card.red{border-left-color:#e74c3c}
        .stat-card.red .value{color:#e74c3c}

        .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:20px}
        .card-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
        .card-header h3{font-size:15px;font-weight:600}
        .card-body{padding:20px}

        /* Tables */
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:10px 12px;background:#f8f9fa;border-bottom:2px solid #eee;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}
        td{padding:10px 12px;border-bottom:1px solid #f5f5f5;font-size:13px}
        tr:hover{background:#f8fff8}
        .badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
        .badge-green{background:#d4edda;color:#155724}
        .badge-yellow{background:#fff3cd;color:#856404}
        .badge-blue{background:#cce5ff;color:#004085}
        .badge-red{background:#f8d7da;color:#721c24}
        .badge-gray{background:#e9ecef;color:#495057}

        /* Forms */
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#555}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.1)}
        .form-group textarea{min-height:80px;resize:vertical}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

        /* Modal */
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center}
        .modal-overlay.show{display:flex}
        .modal{background:#fff;border-radius:12px;width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .modal-header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .modal-header h3{font-size:16px}
        .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#888}
        .modal-body{padding:20px}
        .modal-footer{padding:16px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}

        /* Chat */
        .chat-container{display:flex;height:calc(100vh - 130px)}
        .chat-list{width:300px;border-right:1px solid #eee;overflow-y:auto}
        .chat-item{padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:all .2s}
        .chat-item:hover{background:#f8fff8}
        .chat-item.active{background:#e8f5e9;border-left:3px solid #1a6b3c}
        .chat-item .name{font-weight:600;font-size:14px}
        .chat-item .preview{color:#888;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .chat-item .time{font-size:11px;color:#aaa;float:right}
        .chat-messages{flex:1;display:flex;flex-direction:column}
        .messages-area{flex:1;overflow-y:auto;padding:20px;background:#f0f2f5}
        .msg{max-width:70%;padding:10px 14px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5}
        .msg-in{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
        .msg-out{background:#dcf8c6;align-self:flex-end;border-bottom-right-radius:4px;margin-left:auto}
        .msg .time{font-size:10px;color:#999;margin-top:4px}
        .reply-box{padding:16px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px}
        .reply-box input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none;font-size:13px}
        .reply-box button{padding:10px 20px;background:#1a6b3c;color:#fff;border:none;border-radius:20px;cursor:pointer}

        /* Services */
        .services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
        .service-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #ccc}
        .service-card.healthy{border-left-color:#27ae60}
        .service-card.unhealthy{border-left-color:#e74c3c}
        .service-card .svc-name{font-weight:600;font-size:15px}
        .service-card .svc-url{color:#888;font-size:11px;margin:4px 0}
        .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
        .dot-green{background:#27ae60}.dot-red{background:#e74c3c}.dot-yellow{background:#f39c12}

        .empty-state{text-align:center;padding:40px;color:#aaa}
        .empty-state i{font-size:48px;margin-bottom:12px;display:block}
        .search-box{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;width:250px;outline:none}
        .search-box:focus{border-color:#1a6b3c}

        @media(max-width:768px){
            .sidebar{width:60px}.sidebar .logo span,.nav-item span,.nav-section{display:none}
            .sidebar .logo{padding:16px;font-size:20px;text-align:center}
            .nav-item{padding:14px;justify-content:center}.nav-item i{margin:0}
            .main{margin-left:60px}
            .chat-list{width:200px}
            .form-row{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<!-- Login -->
<div class="login-page" id="loginPage">
    <div class="login-box">
        <i class="fas fa-seedling" style="font-size:48px;color:#1a6b3c;margin-bottom:12px"></i>
        <h1>VartMap Krishi Sahayak</h1>
        <p class="sub">Admin Control Panel</p>
        <div class="error-msg" id="loginError"></div>
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn btn-primary" onclick="login()">Sign In</button>
    </div>
</div>

<!-- App -->
<div class="app" id="app">
    <div class="sidebar">
        <div class="logo"><i class="fas fa-seedling"></i> VartMap <span>Krishi Sahayak Admin</span></div>
        <div class="nav-section">Main</div>
        <div class="nav-item active" onclick="navigate('overview')"><i class="fas fa-chart-pie"></i><span>Overview</span></div>
        <div class="nav-item" onclick="navigate('conversations')"><i class="fas fa-comments"></i><span>Conversations</span></div>
        <div class="nav-item" onclick="navigate('farmers')"><i class="fas fa-users"></i><span>Farmers</span></div>
        <div class="nav-section">Engage</div>
        <div class="nav-item" onclick="navigate('templates')"><i class="fas fa-file-alt"></i><span>Templates</span></div>
        <div class="nav-item" onclick="navigate('campaigns')"><i class="fas fa-bullhorn"></i><span>Campaigns</span></div>
        <div class="nav-item" onclick="navigate('rewards')"><i class="fas fa-gift"></i><span>Rewards</span></div>
        <div class="nav-item" onclick="navigate('referrals')"><i class="fas fa-share-alt"></i><span>Referrals</span></div>
        <div class="nav-section">Content</div>
        <div class="nav-item" onclick="navigate('schemes')"><i class="fas fa-landmark"></i><span>Govt Schemes</span></div>
        <div class="nav-item" onclick="navigate('products')"><i class="fas fa-box"></i><span>Products</span></div>
        <div class="nav-item" onclick="navigate('mandi')"><i class="fas fa-store"></i><span>Mandi Prices</span></div>
        <div class="nav-section">System</div>
        <div class="nav-item" onclick="navigate('moderation')"><i class="fas fa-shield-alt"></i><span>Moderation</span></div>
        <div class="nav-item" onclick="navigate('services')"><i class="fas fa-server"></i><span>Services</span></div>
        <div class="nav-item" onclick="navigate('analytics')"><i class="fas fa-chart-bar"></i><span>Analytics</span></div>
    </div>

    <div class="main">
        <div class="topbar">
            <h2 id="pageTitle">Overview</h2>
            <div class="topbar-right">
                <span class="user-name" id="userName"></span>
                <button class="btn btn-sm btn-outline" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="content" id="pageContent"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header"><h3 id="modalTitle">Modal</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<script>
const API='https://vartmap-admin-api.onrender.com';
const SVCS=[
    {name:'WhatsApp Gateway',url:'https://vartmap-whatsapp-gateway.onrender.com/health'},
    {name:'Intelligence Service',url:'https://vartmap-intelligence.onrender.com/health'},
    {name:'Admin API',url:'https://vartmap-admin-api.onrender.com/health'}
];
let token=localStorage.getItem('vm_token'),user=JSON.parse(localStorage.getItem('vm_user')||'null');
let currentPage='overview',selectedFarmer=null;

if(token&&user)showApp();

async function login(){
    const email=document.getElementById('loginEmail').value,pass=document.getElementById('loginPass').value;
    const err=document.getElementById('loginError');err.style.display='none';
    try{
        const r=await fetch(`${API}/api/v1/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
        const d=await r.json();
        if(r.ok&&d.token){token=d.token;user=d.user;localStorage.setItem('vm_token',token);localStorage.setItem('vm_user',JSON.stringify(user));showApp();}
        else{err.textContent=d.error||'Login failed';err.style.display='block';}
    }catch(e){err.textContent='Connection error';err.style.display='block';}
}
function logout(){token=null;user=null;localStorage.removeItem('vm_token');localStorage.removeItem('vm_user');location.reload();}
function showApp(){document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('userName').textContent=user?.name||user?.email;navigate('overview');}

async function api(path,opt={}){
    const r=await fetch(`${API}${path}`,{...opt,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})}});
    if(r.status===401)return logout();return r.json();
}

function navigate(page){
    currentPage=page;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    event?.target?.closest?.('.nav-item')?.classList.add('active');
    document.getElementById('pageTitle').textContent=page.charAt(0).toUpperCase()+page.slice(1);
    const c=document.getElementById('pageContent');
    c.innerHTML='<div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading...</div>';
    switch(page){
        case'overview':loadOverview();break;case'farmers':loadFarmers();break;case'conversations':loadConversations();break;
        case'templates':loadTemplates();break;case'campaigns':loadCampaigns();break;case'rewards':loadRewards();break;
        case'referrals':loadReferrals();break;case'schemes':loadSchemes();break;case'products':loadProducts();break;
        case'mandi':loadMandi();break;case'moderation':loadModeration();break;case'services':loadServices();break;
        case'analytics':loadAnalytics();break;
    }
}

// ===== OVERVIEW =====
async function loadOverview(){
    const d=await api('/api/v1/dashboard');const c=document.getElementById('pageContent');
    c.innerHTML=`
    <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Farmers</div><div class="value">${d.total_farmers}</div><div class="sub">Registered on platform</div></div>
        <div class="stat-card blue"><div class="label">Conversations (24h)</div><div class="value">${d.conversations_24h}</div><div class="sub">Messages today</div></div>
        <div class="stat-card orange"><div class="label">Active Farmers (24h)</div><div class="value">${d.active_farmers_24h}</div><div class="sub">Unique users today</div></div>
        <div class="stat-card"><div class="label">New Farmers (7d)</div><div class="value">${d.new_farmers_7d}</div><div class="sub">This week</div></div>
        <div class="stat-card blue"><div class="label">Templates</div><div class="value">${d.total_templates}</div><div class="sub">Message templates</div></div>
        <div class="stat-card orange"><div class="label">Active Campaigns</div><div class="value">${d.active_campaigns}</div><div class="sub">Running now</div></div>
        <div class="stat-card"><div class="label">Conversations (7d)</div><div class="value">${d.conversations_7d}</div><div class="sub">This week</div></div>
        <div class="stat-card red"><div class="label">Moderation Queue</div><div class="value">${d.moderation_pending}</div><div class="sub">Pending review</div></div>
    </div>`;
}

// ===== FARMERS =====
async function loadFarmers(){
    const d=await api('/api/v1/farmers?limit=100');const c=document.getElementById('pageContent');
    let rows='';
    if(d.farmers?.length){
        d.farmers.forEach(f=>{
            const badge=f.status==='active'?'badge-green':f.status==='blocked'?'badge-red':'badge-gray';
            const stage=f.onboarding_stage==='complete'?'badge-blue':f.onboarding_stage==='new'?'badge-yellow':'badge-green';
            rows+=`<tr onclick="viewFarmer('${f.id}')" style="cursor:pointer">
                <td><strong>${f.name||'-'}</strong></td><td>${f.phone}</td><td>${f.village||'-'}</td>
                <td>${(f.crops||[]).join(', ')||'-'}</td><td><span class="badge ${stage}">${f.onboarding_stage||'new'}</span></td>
                <td><span class="badge ${badge}">${f.status}</span></td>
                <td>${new Date(f.created_at).toLocaleDateString()}</td></tr>`;
        });
    }
    c.innerHTML=`
    <div class="card"><div class="card-header"><h3>Farmers (${d.total||0})</h3>
        <div><input class="search-box" placeholder="Search farmers..." onkeyup="searchFarmers(this.value)">
        </div></div>
    <div class="card-body">${d.farmers?.length?`<table><thead><tr><th>Name</th><th>Phone</th><th>Village</th><th>Crops</th><th>Stage</th><th>Status</th><th>Joined</th></tr></thead><tbody id="farmersBody">${rows}</tbody></table>`:'<div class="empty-state"><i class="fas fa-users"></i>No farmers registered yet</div>'}</div></div>`;
}

async function searchFarmers(q){
    const d=await api(`/api/v1/farmers?limit=100&search=${encodeURIComponent(q)}`);
    let rows='';
    d.farmers?.forEach(f=>{
        const badge=f.status==='active'?'badge-green':'badge-gray';
        rows+=`<tr onclick="viewFarmer('${f.id}')" style="cursor:pointer"><td><strong>${f.name||'-'}</strong></td><td>${f.phone}</td><td>${f.village||'-'}</td><td>${(f.crops||[]).join(', ')||'-'}</td><td><span class="badge badge-yellow">${f.onboarding_stage||'new'}</span></td><td><span class="badge ${badge}">${f.status}</span></td><td>${new Date(f.created_at).toLocaleDateString()}</td></tr>`;
    });
    document.getElementById('farmersBody').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:#aaa">No results</td></tr>';
}

async function viewFarmer(id){
    const d=await api(`/api/v1/farmers/${id}`);const f=d.farmer;
    let convHtml='';d.conversations?.forEach(c=>{
        convHtml+=`<div class="msg ${c.direction==='inbound'?'msg-in':'msg-out'}">${c.content||'[media]'}<div class="time">${new Date(c.created_at).toLocaleString()}</div></div>`;
    });
    openModal('Farmer Details',`
        <div class="form-row"><div class="form-group"><label>Name</label><input id="ef_name" value="${f.name||''}"></div>
        <div class="form-group"><label>Phone</label><input value="${f.phone}" disabled></div></div>
        <div class="form-row"><div class="form-group"><label>Village</label><input id="ef_village" value="${f.village||''}"></div>
        <div class="form-group"><label>Language</label><select id="ef_lang"><option value="hi" ${f.language==='hi'?'selected':''}>Hindi</option><option value="en" ${f.language==='en'?'selected':''}>English</option><option value="mr" ${f.language==='mr'?'selected':''}>Marathi</option><option value="te" ${f.language==='te'?'selected':''}>Telugu</option></select></div></div>
        <div class="form-row"><div class="form-group"><label>Status</label><select id="ef_status"><option value="active" ${f.status==='active'?'selected':''}>Active</option><option value="blocked" ${f.status==='blocked'?'selected':''}>Blocked</option><option value="inactive" ${f.status==='inactive'?'selected':''}>Inactive</option></select></div>
        <div class="form-group"><label>Land (acres)</label><input id="ef_land" type="number" value="${f.land_holding_acres||''}"></div></div>
        <h4 style="margin:16px 0 8px">Recent Conversations</h4>
        <div style="max-height:300px;overflow-y:auto;background:#f0f2f5;border-radius:8px;padding:12px;display:flex;flex-direction:column">${convHtml||'<div class="empty-state">No conversations yet</div>'}</div>
    `,`<button class="btn btn-primary" onclick="saveFarmer('${f.id}')">Save Changes</button>`);
}

async function saveFarmer(id){
    await api(`/api/v1/farmers/${id}`,{method:'PUT',body:JSON.stringify({
        name:document.getElementById('ef_name').value,village:document.getElementById('ef_village').value,
        language:document.getElementById('ef_lang').value,status:document.getElementById('ef_status').value,
        land_holding_acres:document.getElementById('ef_land').value||null
    })});closeModal();loadFarmers();
}

// ===== CONVERSATIONS =====
async function loadConversations(){
    const d=await api('/api/v1/conversations?limit=100');const c=document.getElementById('pageContent');
    let items='';const grouped={};
    d.conversations?.forEach(cv=>{
        const key=cv.farmer_id;
        if(!grouped[key])grouped[key]={name:cv.farmer_name||cv.farmer_phone,phone:cv.farmer_phone,id:key,messages:[],last:cv.created_at,preview:cv.content};
        grouped[key].messages.push(cv);
    });
    Object.values(grouped).sort((a,b)=>new Date(b.last)-new Date(a.last)).forEach(g=>{
        items+=`<div class="chat-item" onclick="openChat('${g.id}','${g.name}')">
            <span class="time">${new Date(g.last).toLocaleTimeString()}</span>
            <div class="name">${g.name||g.phone}</div><div class="preview">${g.preview||'...'}</div></div>`;
    });
    c.innerHTML=`<div class="chat-container"><div class="chat-list">${items||'<div class="empty-state"><i class="fas fa-comments"></i>No conversations</div>'}</div>
    <div class="chat-messages" id="chatArea"><div class="messages-area"><div class="empty-state"><i class="fas fa-comment-dots"></i>Select a conversation</div></div></div></div>`;
}

async function openChat(farmerId,name){
    selectedFarmer=farmerId;
    const d=await api(`/api/v1/farmers/${farmerId}`);
    let msgs='';d.conversations?.reverse().forEach(c=>{
        msgs+=`<div class="msg ${c.direction==='inbound'?'msg-in':'msg-out'}">${c.content||'[media]'}<div class="time">${new Date(c.created_at).toLocaleString()}</div></div>`;
    });
    document.getElementById('chatArea').innerHTML=`
        <div style="padding:12px 16px;background:#fff;border-bottom:1px solid #eee;font-weight:600">${name} <span style="font-weight:400;color:#888;font-size:12px">${d.farmer?.phone||''}</span></div>
        <div class="messages-area" id="msgsArea" style="display:flex;flex-direction:column">${msgs||'<div class="empty-state">No messages</div>'}</div>
        <div class="reply-box"><input id="replyInput" placeholder="Type a reply..." onkeypress="if(event.key==='Enter')sendReply()"><button onclick="sendReply()"><i class="fas fa-paper-plane"></i></button></div>`;
    document.getElementById('msgsArea').scrollTop=99999;
}

async function sendReply(){
    const msg=document.getElementById('replyInput').value;if(!msg||!selectedFarmer)return;
    document.getElementById('replyInput').value='';
    await api('/api/v1/conversations/reply',{method:'POST',body:JSON.stringify({farmer_id:selectedFarmer,message:msg})});
    const area=document.getElementById('msgsArea');
    area.innerHTML+=`<div class="msg msg-out">${msg}<div class="time">Just now</div></div>`;
    area.scrollTop=99999;
}

function openModal(title,body,footer=''){
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=body;
    document.getElementById('modalFooter').innerHTML=footer;
    document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
