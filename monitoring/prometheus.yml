global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "whatsapp-gateway"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [vartmap]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: whatsapp-gateway
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        target_label: __address__
        replacement: "${1}:3000"

  - job_name: "intelligence-service"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [vartmap]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: intelligence-service
        action: keep
    metrics_path: /metrics
    static_configs:
      - targets: ["intelligence-service:8000"]

  - job_name: "admin-api"
    static_configs:
      - targets: ["admin-api:3001"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "node"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):10250"
        replacement: "${1}:9100"
        target_label: __address__
