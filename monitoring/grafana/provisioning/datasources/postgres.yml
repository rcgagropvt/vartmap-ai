apiVersion: 1
datasources:
  - name: VartMap PostgreSQL
    type: postgres
    url: postgres.vartmap.svc.cluster.local:5432
    database: vartmap
    user: vartmap_readonly
    secureJsonData:
      password: $POSTGRES_READONLY_PASSWORD
    jsonData:
      sslmode: require
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
