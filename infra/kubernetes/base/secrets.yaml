# ═══════════════════════════════════════════════════════════════
# ExternalSecret (using external-secrets-operator)
# Pulls secrets from AWS Secrets Manager / Vault into K8s Secrets.
# Never store actual secret values in this file.
# ═══════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vartmap-secrets
  namespace: vartmap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vartmap-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: vartmap/production
        property: DATABASE_URL
    - secretKey: redis-url
      remoteRef:
        key: vartmap/production
        property: REDIS_URL
    - secretKey: openai-api-key
      remoteRef:
        key: vartmap/production
        property: OPENAI_API_KEY
    - secretKey: data-gov-api-key
      remoteRef:
        key: vartmap/production
        property: DATA_GOV_API_KEY
    - secretKey: jwt-secret
      remoteRef:
        key: vartmap/production
        property: JWT_SECRET
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: whatsapp-secrets
  namespace: vartmap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: whatsapp-secrets
    creationPolicy: Owner
  data:
    - secretKey: app-secret
      remoteRef:
        key: vartmap/whatsapp
        property: META_APP_SECRET
    - secretKey: access-token
      remoteRef:
        key: vartmap/whatsapp
        property: META_ACCESS_TOKEN
    - secretKey: phone-number-id
      remoteRef:
        key: vartmap/whatsapp
        property: PHONE_NUMBER_ID
    - secretKey: webhook-verify-token
      remoteRef:
        key: vartmap/whatsapp
        property: WEBHOOK_VERIFY_TOKEN
