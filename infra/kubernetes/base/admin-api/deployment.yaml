apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: vartmap
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: vartmap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: admin-api
          image: REGISTRY/vartmap/admin-api:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: vartmap-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
