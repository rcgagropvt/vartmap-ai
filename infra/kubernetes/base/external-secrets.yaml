apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vartmap-secrets
  namespace: vartmap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vartmap-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: vartmap/production
        property: DATABASE_URL
    - secretKey: WA_ACCESS_TOKEN
      remoteRef:
        key: vartmap/production
        property: WA_ACCESS_TOKEN
    - secretKey: WA_APP_SECRET
      remoteRef:
        key: vartmap/production
        property: WA_APP_SECRET
    - secretKey: WA_WEBHOOK_VERIFY_TOKEN
      remoteRef:
        key: vartmap/production
        property: WA_WEBHOOK_VERIFY_TOKEN
    - secretKey: WA_PHONE_NUMBER_ID
      remoteRef:
        key: vartmap/production
        property: WA_PHONE_NUMBER_ID
    - secretKey: WA_BUSINESS_ACCOUNT_ID
      remoteRef:
        key: vartmap/production
        property: WA_BUSINESS_ACCOUNT_ID
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: vartmap/production
        property: OPENAI_API_KEY
    - secretKey: OPENWEATHER_API_KEY
      remoteRef:
        key: vartmap/production
        property: OPENWEATHER_API_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: vartmap/production
        property: JWT_SECRET
    - secretKey: ADMIN_INITIAL_PASSWORD
      remoteRef:
        key: vartmap/production
        property: ADMIN_INITIAL_PASSWORD
    - secretKey: DATA_GOV_API_KEY
      remoteRef:
        key: vartmap/production
        property: DATA_GOV_API_KEY
