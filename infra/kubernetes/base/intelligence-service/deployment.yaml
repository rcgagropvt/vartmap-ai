apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-service
  namespace: vartmap
  labels:
    app.kubernetes.io/name: intelligence-service
    app.kubernetes.io/component: intelligence
    app.kubernetes.io/part-of: vartmap
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intelligence-service
        app.kubernetes.io/component: intelligence
        app.kubernetes.io/part-of: vartmap
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vartmap-intelligence
      terminationGracePeriodSeconds: 60

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: intelligence-service

      # Model embedding loading needs time at startup
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z qdrant.vartmap.svc.cluster.local 6333; do echo waiting for qdrant; sleep 2; done']

      containers:
        - name: intelligence
          image: REGISTRY/vartmap/intelligence-service:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: vartmap-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: redis-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: openai-api-key
            - name: DATA_GOV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: data-gov-api-key

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false  # needs /tmp for model cache
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: model-cache
              mountPath: /app/.cache

      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 2Gi

      imagePullSecrets:
        - name: ecr-registry-secret
