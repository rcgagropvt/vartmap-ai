apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-gateway
  namespace: vartmap
  labels:
    app: whatsapp-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whatsapp-gateway
  template:
    metadata:
      labels:
        app: whatsapp-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vartmap-sa
      containers:
        - name: whatsapp-gateway
          image: vartmap/whatsapp-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: vartmap-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-gateway
  namespace: vartmap
spec:
  selector:
    app: whatsapp-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
