apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vartmap-ingress
  namespace: vartmap
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vartmap.in
        - admin.vartmap.in
      secretName: vartmap-tls
  rules:
    - host: api.vartmap.in
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: whatsapp-gateway
                port:
                  number: 3000
          - path: /api/v1/messages
            pathType: Prefix
            backend:
              service:
                name: whatsapp-gateway
                port:
                  number: 3000
    - host: admin.vartmap.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  number: 3001
