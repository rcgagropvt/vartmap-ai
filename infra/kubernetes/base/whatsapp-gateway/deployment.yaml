apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-gateway
  namespace: vartmap
  labels:
    app.kubernetes.io/name: whatsapp-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: vartmap
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: vartmap
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vartmap-gateway
      terminationGracePeriodSeconds: 30

      # ─── Anti-Affinity: spread across AZs ──────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: whatsapp-gateway

      containers:
        - name: gateway
          image: REGISTRY/vartmap/whatsapp-gateway:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: vartmap-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vartmap-secrets
                  key: redis-url
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: whatsapp-secrets
                  key: app-secret
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: whatsapp-secrets
                  key: access-token
            - name: PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: whatsapp-secrets
                  key: phone-number-id
            - name: WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: whatsapp-secrets
                  key: webhook-verify-token

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      imagePullSecrets:
        - name: ecr-registry-secret
